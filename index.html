<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keamanan Pintu IoT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-closed: #ef4444; /* Merah */
            --color-open: #10b981;   /* Hijau */
            --color-accent: #38bdf8; /* Biru Neon */
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            background: -webkit-linear-gradient(var(--color-accent), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .binary-display {
            font-family: 'Orbitron', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--color-accent);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .decimal-display {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fbbf24; /* Kuning Amber */
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        .status-display {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .is-closed .status-display { color: var(--color-closed); }
        .is-closed { border-top: 4px solid var(--color-closed); }
        
        .is-open .status-display { color: var(--color-open); text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .is-open { border-top: 4px solid var(--color-open); }

        .last-update {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 15px;
        }

        /* Styling Log Aktivitas */
        .log-section {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #334155;
            box-sizing: border-box;
        }

        .log-section h3 {
            margin-top: 0;
            font-family: 'Orbitron', sans-serif;
            color: var(--text-main);
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .log-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-list li {
            padding: 10px 0;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .log-list li:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--color-accent);
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
        }

        .log-success { color: var(--color-open); }
        .log-fail { color: var(--color-closed); }

    </style>
</head>
<body>

    <div class="header">
        <h1>SISTEM KEAMANAN</h1>
        <p>Real-time Monitoring Biner Dashboard</p>
    </div>

    <div class="dashboard-grid">
        <!-- Card Biner -->
        <div class="card">
            <div class="card-title">KODE BINER INPUT</div>
            <div id="kode-val" class="binary-display">-----</div>
        </div>

        <!-- Card Desimal (FITUR BARU) -->
        <div class="card">
            <div class="card-title">NILAI DESIMAL</div>
            <div id="decimal-val" class="decimal-display">--</div>
        </div>

        <!-- Card Status Pintu -->
        <div class="card" id="status-card">
            <div class="card-title">STATUS PINTU</div>
            <div id="status-val" class="status-display">Memuat...</div>
            <div id="last-update" class="last-update">Update terakhir: -</div>
        </div>
    </div>

    <!-- Log Aktivitas (FITUR BARU) -->
    <div class="log-section">
        <h3>Log Aktivitas Sistem</h3>
        <ul class="log-list" id="log-list">
            <li style="color: var(--text-muted);">Menunggu aktivitas...</li>
        </ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // GANTI DENGAN KREDENSIAL FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "ISI_DENGAN_API_KEY_WEB_ANDA",
            authDomain: "biner-pintu-default-rtdb.asia-southeast1.firebasedatabase.app",
            databaseURL: "https://biner-pintu-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ISI_DENGAN_PROJECT_ID",
            storageBucket: "ISI_DENGAN_STORAGE_BUCKET",
            messagingSenderId: "ISI_DENGAN_MESSAGING_SENDER_ID",
            appId: "ISI_DENGAN_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pintuRef = ref(db, 'PintuKeamanan');

        // Referensi DOM
        const kodeEl = document.getElementById('kode-val');
        const decimalEl = document.getElementById('decimal-val');
        const statusEl = document.getElementById('status-val');
        const statusCard = document.getElementById('status-card');
        const lastUpdateEl = document.getElementById('last-update');
        const logList = document.getElementById('log-list');

        let statusPintuSebelumnya = null;
        let isFirstLoad = true;

        // Fungsi Format Waktu
        function getWaktuSekarang() {
            const now = new Date();
            return now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // Fungsi Tambah Log
        function tambahLog(pesan, tipe) {
            if (isFirstLoad) {
                logList.innerHTML = ''; // Hapus teks "menunggu aktivitas" saat event pertama
                isFirstLoad = false;
            }
            
            const li = document.createElement('li');
            li.innerHTML = `<span>${pesan}</span> <span class="log-time">[${getWaktuSekarang()}]</span>`;
            
            if (tipe === 'success') li.classList.add('log-success');
            if (tipe === 'fail') li.classList.add('log-fail');
            
            // Tambahkan di urutan paling atas
            logList.insertBefore(li, logList.firstChild);
            
            // Batasi maksimal 10 log agar tidak penuh
            if (logList.children.length > 10) {
                logList.removeChild(logList.lastChild);
            }
        }

        // Listener Realtime
        onValue(pintuRef, (snapshot) => {
            const data = snapshot.val();
            
            if (data) {
                // 1. Update Biner
                const binerInput = data.KodeInput;
                kodeEl.innerText = binerInput;

                // 2. Konversi Biner ke Desimal (Fitur Baru)
                // Menggunakan fungsi parseInt bawaan Javascript (string, basis numerik)
                const nilaiDesimal = parseInt(binerInput, 2);
                decimalEl.innerText = nilaiDesimal;

                // 3. Update Jam Terakhir (Fitur Baru)
                lastUpdateEl.innerText = `Update terakhir: ${getWaktuSekarang()}`;

                // 4. Update Status UI & Log (Fitur Baru)
                const statusSekarang = data.StatusPintu;

                if (statusSekarang === "Tertutup" || statusSekarang === "Tertutup (Kode Salah)") {
                    statusEl.innerHTML = `<span class="status-icon">🔒</span> TERTUTUP`;
                    statusCard.className = 'card is-closed';
                    
                    // Catat ke Log jika status berubah
                    if (statusPintuSebelumnya === "Terbuka") {
                        tambahLog(`Pintu dikunci. Kode biner diubah ke: ${binerInput}`, 'fail');
                    }
                } else {
                    statusEl.innerHTML = `<span class="status-icon">🔓</span> TERBUKA`;
                    statusCard.className = 'card is-open';
                    
                    // Catat ke Log jika pintu baru saja terbuka
                    if (statusPintuSebelumnya !== "Terbuka") {
                        tambahLog(`Akses Diterima! Pintu terbuka (Desimal: ${nilaiDesimal})`, 'success');
                    }
                }
                
                // Simpan status saat ini untuk pengecekan berikutnya
                statusPintuSebelumnya = statusSekarang;
            }
        });
    </script>
</body>
</html>
